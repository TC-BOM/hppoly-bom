<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Poly Video Conference's Gem: "Bill" of Materials Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Universal system font stack — original clean format */
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
    }
    input.bom-qty {
      appearance: textfield;
      -moz-appearance: textfield;
    }
    input.bom-qty::-webkit-inner-spin-button,
    input.bom-qty::-webkit-outer-spin-button {
      display: none;
      appearance: none;
      -webkit-appearance: none;
      margin: 0;
    }
  </style>
</head>
<body class="bg-white text-gray-900">
  <a href="https://tc-bom.github.io/PolyBOMGenerator/" class="fixed top-3 right-3 z-50 inline-flex items-center gap-1.5 rounded-full border border-gray-200 bg-white/95 px-2.5 py-1 text-[11px] font-semibold text-gray-600 shadow-sm no-underline select-none" aria-label="Switch to Classic site">
    <span>Classic</span>
    <span class="relative inline-block h-5 w-9 shrink-0 rounded-full bg-blue-500" aria-hidden="true">
      <span class="absolute right-0.5 top-0.5 h-4 w-4 rounded-full bg-white shadow"></span>
    </span>
    <span>New</span>
  </a>
  <div class="max-w-5xl mx-auto p-6">
    <h1 class="text-3xl font-extrabold mb-4 pr-28">Poly Video Conference's Gem: "Bill" of Materials Generator</h1>
    <nav id="tabBar" class="mb-6 text-3xl font-light tracking-wide select-none" aria-label="Product category">
      <button type="button" id="tabVideo" data-panel="video" class="tab-btn opacity-100 text-gray-900">VIDEO</button>
      <span class="text-gray-300 mx-3">|</span>
      <button type="button" id="tabAudio" data-panel="audio" class="tab-btn opacity-30 text-gray-900">AUDIO</button>
      <span class="text-gray-300 mx-3">|</span>
      <button type="button" id="tabHeadset" disabled aria-disabled="true" title="Coming soon" class="opacity-20 text-gray-400 cursor-not-allowed pointer-events-none">HEADSETS</button>
    </nav>
    <div id="app">Loading...</div>
  </div>

  <!-- IMPORTANT: cache-busted script reference -->
  <script>
  (function(){
    var s=document.createElement('script');
    s.src='script.js?v=10.71&ts='+Date.now();
    s.defer=true;
    document.currentScript.parentNode.insertBefore(s, document.currentScript);
  })();
</script>
</body>
</html>
