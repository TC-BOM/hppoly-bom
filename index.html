<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>Poly Video Conference's Gem: "Bill" of Materials Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Universal system font stack — original clean format */
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
    }
    input.bom-qty {
      appearance: textfield;
      -moz-appearance: textfield;
    }
    input.bom-qty::-webkit-inner-spin-button,

      display: none;

  <!-- IMPORTANT: cache-busted script reference -->

  (function(){
    var s=document.createElement('script');
    s.src='script.js?v=10.61&ts='+Date.now();
